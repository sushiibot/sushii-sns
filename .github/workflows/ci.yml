name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CLAUDE.md"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install
      - run: bun test

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: sushiibot/sushii-workflows/.github/workflows/build-verified.yml@20fa6954e3c62b1137519e8790706116c5fffbe9
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: sushiibot/sushii-workflows/.github/workflows/release-auto.yml@20fa6954e3c62b1137519e8790706116c5fffbe9
    permissions:
      contents: read
      actions: read
      statuses: write
      id-token: write
      attestations: write
    with:
      target: production
      artifact_digest: ${{ needs.build.outputs.artifact_digest }}
